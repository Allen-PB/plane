name: PathBuilder validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/pathbuilder/check_locale_bundle.mjs --preflight
      - run: pnpm exec turbo run build --filter=web --filter=admin --filter=space --concurrency=1
      - run: node tools/pathbuilder/check_locale_bundle.mjs apps/web/build/client
      - run: node --test packages/constants/tests/workspace-settings.test.mjs
      - run: pnpm --filter web test
      - run: pnpm --filter @plane/blocks exec vitest run --project=dom src/icons/brand/pathbuilder.test.tsx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/pathbuilder/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          pnpm --filter web start > /tmp/pathbuilder-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          python tools/pathbuilder/check_browser.py
      - run: pnpm exec turbo run check:lint check:types --filter=web --filter=admin --filter=space --filter=@plane/blocks --filter=@plane/constants --filter=@plane/i18n --concurrency=1
  branding-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Django==5.2.15
      - run: python tools/pathbuilder/check_branding.py
